baseURL = 'https://reklamai.lt/'
locale = 'lt-LT'
defaultContentLanguage = 'lt'
title = 'Primum Print'
theme = 'blowfish'

[languages.lt]
  languageName = "Lietuvių"
  weight = 1

# Wymagane formaty wyjściowe dla strony głównej i sekcji
[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Menu główne
[menus]
