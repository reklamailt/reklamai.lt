        <dc:title>Primum Print reklamai.lt UAB Primum</dc:title>
        <dc:description>Profesionali reklama ir skaitmeninė spauda
Realizuojame užsakymus nuo vieno egzemplioriaus iki didelių tiražų. Užtikriname nuosavą gamybos bazę, modernų parką bei operatyvų vykdymą visoje Lietuvoje.

Plačiaformatė spauda Lauko ir vidaus reklamos sprendimai: reklaminiai tentai, tiesioginė UV spauda ant plokščių medžiagų, backlit plakatai šviesdėžėms, lipdukai bei informacinės lentelės.
Kartono gaminiai ir pakuotės Tvarūs sprendimai prekybos vietoms ir logistikai: prekybiniai stovai (FSDU), stoveliai ant prekystalio, paletinės dekoracijos, dėžės bei proginės pakuotės.
</dc:description>
      </cc:Work>
    </rdf:RDF>
  </metadata>
